[project]
name = "somzhong-bot"
version = "0.1.0"
description = "A LINE beer venue recommendation bot"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "line-bot-sdk>=3,<4",
    "pydantic>=2.12,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/somzhong_bot"]
